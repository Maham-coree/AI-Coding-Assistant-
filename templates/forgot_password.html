{% extends "base.html" %}
{% block title %}Forgot password · AI Coding Assistant{% endblock %}
{% block auth_content %}
<section class="auth-card">
    <a class="brand-block auth-brand" href="{{ url_for('login') }}">
        <span class="brand-mark">AI</span>
        <span><span class="eyebrow">Private developer workspace</span><strong>AI Coding Assistant</strong></span>
    </a>
    <h1>Reset your password</h1>
    <p class="muted">Enter your account email and we’ll send a reset link if an account matches.</p>
    <form method="post" class="stack-form" data-disable-on-submit>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="field"><span>Email address</span><input type="email" name="email" autocomplete="email" required maxlength="254"></label>
        <button type="submit" class="primary-button">Send reset link</button>
    </form>
    <p class="auth-switch"><a href="{{ url_for('login') }}">Back to log in</a></p>
</section>
{% endblock %}
